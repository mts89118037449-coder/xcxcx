<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Зона</title>
    <link rel="preload" as="image" href="/splash.jpg" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* загрузочный экран: показывается сразу, ещё до скриптов игры */
      html, body { margin: 0; background: #15130f; }
      #boot { position: fixed; inset: 0; z-index: 9999; background: #15130f url(/splash.jpg) center top / cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; transition: opacity 0.5s, transform 0.5s; font-family: system-ui, -apple-system, sans-serif; }
      #boot.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #boot .boot-bottom { padding: 18px 22px calc(26px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, #000d 38%); }
      #boot .boot-tip { min-height: 38px; color: #f2e6c8; font-size: 14px; line-height: 1.35; text-align: center; text-shadow: 0 1px 3px #000; transition: opacity 0.3s; }
      #boot .boot-bar { height: 12px; margin-top: 10px; border-radius: 8px; border: 2px solid #1a1206; background: #3a2e18; overflow: hidden; box-shadow: 0 2px 0 #000a; }
      #boot .boot-bar i { display: block; height: 100%; width: 8%; background: repeating-linear-gradient(-45deg, #ffd24a 0 10px, #e0a92a 10px 20px); border-radius: 6px; transition: width 0.4s; }
      #boot .boot-label { margin-top: 6px; text-align: center; color: #c9b88a; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-bottom">
        <div class="boot-tip" id="boot-tip">Конвой ведёт в хату…</div>
        <div class="boot-bar"><i id="boot-bar"></i></div>
        <div class="boot-label">ЗАГРУЗКА</div>
      </div>
    </div>
    <script>
      (function () {
        var tips = [
          'Совет: мыло в бане не роняй. Даже если очень хочется.',
          'Совет: кто рано встаёт — того раньше шмонают.',
          'Совет: баланду ешь быстро, пока она не съела тебя.',
          'Совет: последнее слово на суде — не последнее. Последнее — у прокурора.',
          'Факт: тараканы на зоне сидят дольше всех. Без права на УДО.',
          'Совет: в карцере тепло. Если очень сильно представить.',
          'Факт: дед из нашей хаты сидит так давно, что помнит, за что.',
          'Совет: не спорь с поваром. Он знает, что в котлетах.',
          'Совет: улыбайся на фото в личное дело. Это последний раз.',
          'Факт: побег — это просто очень длинная прогулка без разрешения.',
        ];
        var tip = document.getElementById('boot-tip');
        var bar = document.getElementById('boot-bar');
        var i = Math.floor(Math.random() * tips.length);
        var w = 8;
        tip.textContent = tips[i];
        window.__bootT = setInterval(function () {
          i = (i + 1) % tips.length;
          tip.style.opacity = 0;
          setTimeout(function () { tip.textContent = tips[i]; tip.style.opacity = 1; }, 300);
        }, 2600);
        window.__bootW = setInterval(function () { w = Math.min(90, w + (90 - w) * 0.12); bar.style.width = w + '%'; }, 250);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
