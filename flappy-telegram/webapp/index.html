<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Bird</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #4ec0ca;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  // ================= Telegram =================
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTelegram = !!(tg && tg.initData);
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#4ec0ca');
  }
  const haptic = (type) => {
    try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(type); } catch (e) {}
  };
  const playerName = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Игрок';
  // Адрес API бота: по умолчанию тот же сервер, либо ?api=https://...
  const API = (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '');

  async function apiCall(method, body = {}) {
    const r = await fetch(API + '/api/' + method, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, initData: tg.initData }),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Ошибка сервера');
    return d;
  }

  // ================= Хранилище =================
  const store = {
    get(k, def) { try { const v = localStorage.getItem('flappy_' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
    set(k, v) { try { localStorage.setItem('flappy_' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const hasCloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9');

  let best = store.get('best', 0);
  let ownedPaid = store.get('skins', []);
  let selectedSkin = store.get('skin', 'classic');

  if (hasCloud) {
    tg.CloudStorage.getItems(['best', 'skin'], (err, v) => {
      if (err || !v) return;
      best = Math.max(best, parseInt(v.best, 10) || 0);
      if (v.skin && SKINS.some((s) => s.id === v.skin)) selectedSkin = previewSkin = v.skin;
    });
  }
  function saveBest() {
    store.set('best', best);
    if (hasCloud) tg.CloudStorage.setItem('best', String(best));
  }
  function saveSkin() {
    store.set('skin', selectedSkin);
    if (hasCloud) tg.CloudStorage.setItem('skin', selectedSkin);
  }

  // ================= Скины =================
  // unlock: открывается при рекорде; stars: покупается за Telegram Stars
  const SKINS = [
    { id: 'classic', name: 'Классика', X: '#543847', y: '#f7c52b', o: '#fae36d', w: '#fafafa', r: '#f2611c' },
    { id: 'red',     name: 'Красная',  X: '#543847', y: '#e8452c', o: '#f99a3d', w: '#fafafa', r: '#f7b733', unlock: 5 },
    { id: 'blue',    name: 'Синяя',    X: '#543847', y: '#3fa7e0', o: '#9ad8f2', w: '#fafafa', r: '#f2611c', unlock: 10 },
    { id: 'zombie',  name: 'Зомби',    X: '#2f3b22', y: '#6fbf3a', o: '#c3e87a', w: '#e6f5d0', r: '#c94a2a', unlock: 25 },
    { id: 'pink',    name: 'Фламинго', X: '#543847', y: '#f27fb5', o: '#fbc3dc', w: '#fff0f7', r: '#f2611c', unlock: 50 },
    { id: 'gold',    name: 'Золотая',  X: '#6b4a00', y: '#e9b10e', o: '#ffe680', w: '#fff6c7', r: '#c97a00', stars: 25 },
    { id: 'ninja',   name: 'Ниндзя',   X: '#000000', y: '#2d2d38', o: '#4a4a5a', w: '#e8e8e8', r: '#d23a3a', stars: 50 },
    { id: 'ice',     name: 'Алмазная', X: '#2a4f73', y: '#7fd8f5', o: '#d6f6ff', w: '#ffffff', r: '#6aa9ff', stars: 100 },
  ];
  const skinById = (id) => SKINS.find((s) => s.id === id) || SKINS[0];
  const isOwned = (s) => (!s.unlock && !s.stars) || (s.unlock && best >= s.unlock) || ownedPaid.includes(s.id);
  if (!isOwned(skinById(selectedSkin))) selectedSkin = 'classic';
  let previewSkin = selectedSkin;

  // ================= Пиксельный спрайт птицы (17×12, как в оригинале) =================
  const BODY = [
    '......XXXXXX.....',
    '....XXyyyXwwX....',
    '...XyyyyXwwwwX...',
    '..XyyyyyXwwwXwX..',
    '.XyyyyyyXwwwXwX..',
    '.XyyyyyyyXwwwwX..',
    '.XyyyyyyyyXXXXXX.',
    '.XyyyyyyyXrrrrrrX',
    '..XXXoooXrXXXXXX.',
    '..XoooooooXrrrrX.',
    '...XXoooooXXXXX..',
    '.....XXXXX.......',
  ];
  const WING_UP_MID = [
    '.XXXX..',
    'XwwwwX.',
    'XwwwwwX',
    'XywwwyX',
    '.XXXXX.',
  ];
  const WING_DOWN = [
    '.XXXXX.',
    'XywwwyX',
    'XwwwwwX',
    '.XwwwX.',
    '..XXX..',
  ];
  const WING_FRAMES = [[WING_UP_MID, 2], [WING_UP_MID, 3], [WING_DOWN, 4], [WING_UP_MID, 3]];
  const SPRITE_W = 17, SPRITE_H = 12, PX = 2.4;

  function paint(c2, grid, ox, oy, pal) {
    grid.forEach((row, y) => [...row].forEach((ch, x) => {
      if (ch === '.') return;
      c2.fillStyle = pal[ch];
      c2.fillRect(ox + x, oy + y, 1, 1);
    }));
  }
  const spriteCache = {};
  function birdSprite(skin, frame) {
    const key = skin.id + frame;
    if (!spriteCache[key]) {
      const c = document.createElement('canvas');
      c.width = SPRITE_W; c.height = SPRITE_H;
      const c2 = c.getContext('2d');
      paint(c2, BODY, 0, 0, skin);
      const [wing, wy] = WING_FRAMES[frame];
      paint(c2, wing, 0, wy, skin);
      spriteCache[key] = c;
    }
    return spriteCache[key];
  }

  // ================= Холст =================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const H = 640;
  let W = 360, scale = 1, offsetX = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = vh / H;
    W = Math.max(280, Math.min(560, vw / scale));
    offsetX = (vw - W * scale) / 2;
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, offsetX * dpr, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ================= Параметры =================
  const GROUND_H = 90;
  const GRAVITY = 1500;
  const FLAP = -430;
  const PIPE_W = 64;
  const GAP = 160;
  const PIPE_SPACING = 210;
  const SPEED = 150;

  // Цена «Продолжить» в Stars растёт с каждой покупкой внутри одной попытки
  // (та же формула на сервере в bot.js)
  const CONTINUE_PRICES = [1, 3, 7, 15, 30, 60, 120, 250, 500, 1000, 2500, 5000, 10000];
  const continuePrice = (n) => CONTINUE_PRICES[Math.min(n, CONTINUE_PRICES.length - 1)];

  const STATE = { READY: 0, PLAY: 1, OVER: 2, RESUME: 3 };
  let state, bird, pipes, score, groundX, overTime, flashT, runId, continues;
  let busy = false, toastText = '', toastT = 0;

  function toast(t) { toastText = t; toastT = 2.5; }

  function reset() {
    state = STATE.READY;
    bird = { x: W * 0.3, y: H * 0.42, vy: 0, r: 13, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    groundX = 0;
    flashT = 0;
    continues = 0;
    runId = Math.random().toString(36).slice(2, 10);
  }
  reset();

  function spawnPipe(x) {
    const minTop = 60, maxTop = H - GROUND_H - GAP - 60;
    pipes.push({ x, top: minTop + Math.random() * (maxTop - minTop), passed: false });
  }

  function start() {
    if (!isOwned(skinById(previewSkin))) previewSkin = selectedSkin;
    state = STATE.PLAY;
    spawnPipe(W + 40);
    flap();
  }

  function flap() {
    bird.vy = FLAP;
    haptic('light');
  }

  function gameOver() {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    overTime = performance.now();
    flashT = 1;
    haptic('heavy');
    if (score > best) { best = score; saveBest(); }
    if (inTelegram && score > 0) apiCall('score', { score }).catch(() => {});
  }

  // После оплаты: убираем ближайшие трубы и даём продолжить с тем же счётом
  function resume() {
    pipes = pipes.filter((p) => p.x > bird.x + 170 || p.x + PIPE_W < bird.x - 60);
    if (!pipes.some((p) => p.x > bird.x)) spawnPipe(W + 40);
    bird.y = H * 0.42;
    bird.vy = 0;
    bird.rot = 0;
    flashT = 0;
    state = STATE.RESUME;
  }

  // ================= Покупки (Telegram Stars) =================
  async function purchase(req) {
    if (busy) return false;
    if (!inTelegram) {
      toast('Демо-режим: оплата пропущена');
      return true;
    }
    busy = true;
    try {
      const { link } = await apiCall('invoice', req);
      return await new Promise((res) => tg.openInvoice(link, (status) => res(status === 'paid')));
    } catch (e) {
      toast(e.message);
      return false;
    } finally {
      busy = false;
    }
  }

  async function buyContinue() {
    if (await purchase({ kind: 'continue', runId, n: continues })) {
      continues++;
      haptic('medium');
      resume();
    }
  }

  async function buySkin(skin) {
    if (await purchase({ kind: 'skin', skin: skin.id })) {
      if (!ownedPaid.includes(skin.id)) ownedPaid.push(skin.id);
      store.set('skins', ownedPaid);
      selectedSkin = previewSkin = skin.id;
      saveSkin();
      haptic('medium');
      toast('Скин «' + skin.name + '» твой!');
    }
  }

  function changeSkin(dir) {
    const i = SKINS.findIndex((s) => s.id === previewSkin);
    previewSkin = SKINS[(i + dir + SKINS.length) % SKINS.length].id;
    if (isOwned(skinById(previewSkin))) { selectedSkin = previewSkin; saveSkin(); }
    haptic('light');
  }

  if (inTelegram) {
    apiCall('state').then((d) => {
      ownedPaid = [...new Set([...ownedPaid, ...(d.skins || [])])];
      store.set('skins', ownedPaid);
      if (d.best > best) { best = d.best; saveBest(); }
    }).catch(() => {});
  }

  // ================= Управление =================
  let buttons = [];
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const lx = (e.clientX - offsetX) / scale, ly = e.clientY / scale;
    for (const b of buttons) {
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) { b.onTap(); return; }
    }
    tap();
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); }
    if (e.code === 'Enter' && state === STATE.OVER) reset();
    if (state === STATE.READY && e.code === 'ArrowLeft') changeSkin(-1);
    if (state === STATE.READY && e.code === 'ArrowRight') changeSkin(1);
  });

  function tap() {
    if (state === STATE.READY) start();
    else if (state === STATE.PLAY) flap();
    else if (state === STATE.RESUME) { state = STATE.PLAY; flap(); }
  }

  // ================= Обновление =================
  function update(dt) {
    if (toastT > 0) toastT -= dt;
    if (flashT > 0) flashT = Math.max(0, flashT - dt * 3);
    if (state !== STATE.OVER) bird.wing += dt * (state === STATE.PLAY ? 14 : 8);
    if (state === STATE.READY || state === STATE.PLAY) groundX = (groundX - SPEED * dt) % 24;

    if (state === STATE.READY || state === STATE.RESUME) {
      bird.y = H * 0.42 + Math.sin(performance.now() / 300) * 8;
      bird.rot = 0;
      return;
    }

    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.45, Math.min(1.5, bird.vy / 550));

    if (bird.y + bird.r >= H - GROUND_H) {
      bird.y = H - GROUND_H - bird.r;
      bird.vy = 0;
      gameOver();
    }
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }

    if (state === STATE.PLAY) {
      for (const p of pipes) p.x -= SPEED * dt;
      if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();
      const lastPipe = pipes[pipes.length - 1];
      if (lastPipe && lastPipe.x < W + 40 - PIPE_SPACING) spawnPipe(lastPipe.x + PIPE_SPACING);

      for (const p of pipes) {
        if (!p.passed && p.x + PIPE_W < bird.x) {
          p.passed = true;
          score++;
          haptic('soft');
        }
        if (circleRect(bird.x, bird.y, bird.r - 2, p.x, 0, PIPE_W, p.top) ||
            circleRect(bird.x, bird.y, bird.r - 2, p.x, p.top + GAP, PIPE_W, H)) {
          gameOver();
        }
      }
    }
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ================= Отрисовка =================
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 130, y: 60 + Math.random() * 160, s: 0.7 + Math.random() * 0.6 }));
  let cloudShift = 0;

  function drawBackground(dt) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#bdeef2');
    ctx.fillStyle = g;
    ctx.fillRect(-400, 0, W + 800, H);

    if (state !== STATE.OVER) cloudShift += dt * 15;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) {
      const x = ((c.x - cloudShift * c.s) % (W + 200) + W + 200) % (W + 200) - 100;
      ctx.beginPath();
      ctx.arc(x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(x + 24 * c.s, c.y - 10 * c.s, 26 * c.s, 0, Math.PI * 2);
      ctx.arc(x + 50 * c.s, c.y, 20 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#a3dfc0';
    for (let i = -1; i < W / 40 + 1; i++) {
      const h = 40 + ((i * 37) % 50 + 50) % 50;
      ctx.fillRect(i * 40, H - GROUND_H - h, 34, h);
    }
    ctx.fillStyle = '#7bd389';
    ctx.beginPath();
    ctx.moveTo(-10, H - GROUND_H);
    for (let x = -10; x <= W + 10; x += 30) ctx.quadraticCurveTo(x + 15, H - GROUND_H - 22, x + 30, H - GROUND_H);
    ctx.fill();
  }

  function drawPipe(x, y, h, flip) {
    const lip = 26;
    const grad = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
    grad.addColorStop(0, '#5fb340');
    grad.addColorStop(0.35, '#9be15d');
    grad.addColorStop(1, '#3e8a2a');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#2d5e1e';
    ctx.lineWidth = 3;
    ctx.fillRect(x, y, PIPE_W, h);
    ctx.strokeRect(x, y, PIPE_W, h);
    const ly = flip ? y + h - lip : y;
    ctx.fillRect(x - 5, ly, PIPE_W + 10, lip);
    ctx.strokeRect(x - 5, ly, PIPE_W + 10, lip);
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(-400, y, W + 800, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(-400, y, W + 800, 16);
    ctx.fillStyle = '#9ce659';
    for (let x = groundX - 24; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y + 16); ctx.lineTo(x + 12, y + 16); ctx.lineTo(x + 24, y); ctx.lineTo(x + 12, y);
      ctx.fill();
    }
    ctx.fillStyle = '#543847';
    ctx.fillRect(-400, y - 2, W + 800, 3);
  }

  function drawBirdAt(skin, x, y, rot, wing, px) {
    const frame = Math.floor(wing) % 4;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(birdSprite(skin, frame), -SPRITE_W * px / 2, -SPRITE_H * px / 2, SPRITE_W * px, SPRITE_H * px);
    ctx.restore();
  }

  function text(str, x, y, size, align = 'center', fill = '#fff') {
    ctx.font = `900 ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(4, size / 6);
    ctx.strokeStyle = '#543847';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = '#ded895';
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 4;
    roundRect(x, y, w, h, 14);
    ctx.fill(); ctx.stroke();
  }

  function button(x, y, w, h, label, color, onTap, size = 22) {
    buttons.push({ x, y, w, h, onTap });
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(x, y + 4, w, h, 12); ctx.fill();
    ctx.fillStyle = color;
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 3;
    roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
    text(label, x + w / 2, y + h / 2 + 1, size);
  }

  function drawSkinPicker() {
    const skin = skinById(previewSkin);
    const owned = isOwned(skin);
    const pw = Math.min(300, W - 30), px = W / 2 - pw / 2, py = 395;
    panel(px, py, pw, 130);
    button(px + 10, py + 30, 44, 44, '◀', '#f2a33a', () => changeSkin(-1), 20);
    button(px + pw - 54, py + 30, 44, 44, '▶', '#f2a33a', () => changeSkin(1), 20);
    drawBirdAt(skin, W / 2, py + 40, 0, bird.wing, 3);
    text(skin.name, W / 2, py + 82, 20);
    if (owned) {
      text(selectedSkin === skin.id ? 'Выбрана' : '', W / 2, py + 110, 16, 'center', '#9be15d');
    } else if (skin.unlock) {
      text('🔒 Рекорд ' + skin.unlock + ' очков', W / 2, py + 110, 16, 'center', '#ffd36b');
    } else {
      button(W / 2 - 80, py + 96, 160, 30, 'Купить за ' + skin.stars + ' ⭐', '#4c9be8', () => buySkin(skin), 16);
    }
  }

  function medal(x, y) {
    let c = null;
    if (score >= 40) c = '#e5e4e2';
    else if (score >= 20) c = '#ffd700';
    else if (score >= 10) c = '#c0c0c0';
    else if (score >= 5) c = '#cd7f32';
    if (!c) return;
    ctx.fillStyle = c;
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.arc(x - 5, y - 5, 5, 0, Math.PI * 2); ctx.fill();
  }

  function draw(dt) {
    buttons = [];
    drawBackground(dt);
    for (const p of pipes) {
      drawPipe(p.x, -4, p.top + 4, true);
      drawPipe(p.x, p.top + GAP, H - GROUND_H - p.top - GAP, false);
    }
    drawGround();
    drawBirdAt(skinById(previewSkin), bird.x, bird.y, bird.rot, bird.wing, PX);

    if (state === STATE.PLAY || state === STATE.RESUME) text(String(score), W / 2, 70, 56);

    if (state === STATE.READY) {
      text('Flappy Bird', W / 2, 110, 44);
      text('Привет, ' + playerName + '!', W / 2, 160, 22);
      text('Тапни, чтобы лететь', W / 2, 335, 24);
      if (best > 0) text('Рекорд: ' + best, W / 2, 368, 18);
      drawSkinPicker();
    }

    if (state === STATE.RESUME) {
      text('Продолжаем!', W / 2, 160, 36);
      text('Тапни, чтобы лететь', W / 2, 335, 24);
    }

    if (state === STATE.OVER) {
      text('Игра окончена', W / 2, 120, 38);
      const pw = Math.min(280, W - 40), px = W / 2 - pw / 2;
      panel(px, 160, pw, 140);
      ctx.fillStyle = '#e86101';
      ctx.font = '800 16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ОЧКИ', W / 2, 182);
      text(String(score), W / 2, 212, 34);
      ctx.fillStyle = '#e86101';
      ctx.font = '800 16px system-ui, sans-serif';
      ctx.fillText('РЕКОРД' + (score > 0 && score === best ? ' — НОВЫЙ!' : ''), W / 2, 248);
      text(String(best), W / 2, 276, 26);
      medal(px + 36, 212);

      if (performance.now() - overTime > 500) {
        const price = continuePrice(continues);
        const label = busy ? 'Оплата…' : '▶ Продолжить · ' + price + ' ⭐';
        button(px, 322, pw, 58, label, '#f2a33a', buyContinue, 22);
        if (continues > 0) text('Следующее продолжение будет дороже!', W / 2, 395, 14, 'center', '#ffd36b');
        button(px + 30, 412, pw - 60, 48, 'Заново', '#5fb340', reset, 22);
      }
    }

    if (flashT > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flashT})`;
      ctx.fillRect(-400, 0, W + 800, H);
    }

    if (toastT > 0) {
      ctx.globalAlpha = Math.min(1, toastT * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      roundRect(20, H - 70, W - 40, 40, 10); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(toastText, W / 2, H - 50);
      ctx.globalAlpha = 1;
    }
  }

  // ================= Цикл =================
  let last = performance.now();
  function loop(now) {
    const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
    last = now;
    update(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
