# /etc/nginx/sites-available/stroyka  — замените stroyka.example.ru на свой домен
server {
    listen 80;
    server_name stroyka.example.ru;

    # Вход по паролю для всего сайта: sudo htpasswd -c /etc/nginx/stroyka.htpasswd prorab
    auth_basic "Stroyka";
    auth_basic_user_file /etc/nginx/stroyka.htpasswd;

    client_max_body_size 25m;   # восстановление из большой копии

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
