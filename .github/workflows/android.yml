name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Name universal APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/SoundAura-universal.apk

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SoundAura-apk
          path: android-app/out/*.apk

      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "SoundAura (${GITHUB_SHA::7})" --target "$GITHUB_SHA" --notes "Один APK для ARM32 и ARM64."
          fi
          gh release upload "$tag" out/SoundAura-universal.apk --clobber
