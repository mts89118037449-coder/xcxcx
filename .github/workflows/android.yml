name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/SoundAura-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/SoundAura-old-phones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundAura-apk
          path: android-app/out/*.apk

      # Для ветки исправлений APK доступен как артефакт Actions.
      # Не перезаписываем общий релиз apk-latest, которым пользуются другие ветки.
      - name: Publish branch release
        if: github.ref == 'refs/heads/fix/soundaura-audio-recovery'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete soundaura-audio-recovery --yes --cleanup-tag || true
          gh release create soundaura-audio-recovery out/*.apk \
            --title "SoundAura — audio recovery" \
            --notes "APK из ветки fix/soundaura-audio-recovery, коммит ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" --prerelease
