name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk out/SoundAura-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk out/SoundAura-old-phones.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundAura-apk
          path: android-app/out/*.apk

      # Свежая сборка всегда лежит в релизе «SoundAura (последняя версия)».
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/*.apk \
            --title "SoundAura (последняя версия)" \
            --notes "Сборка из ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Для большинства телефонов — SoundAura-arm64.apk." \
            --target "$GITHUB_SHA"
