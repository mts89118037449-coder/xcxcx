name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assemblePhoneRelease assembleTvRelease --no-daemon --build-cache --parallel

      - name: Prepare phone and TV APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print
          cp app/build/outputs/apk/phone/release/app-phone-arm64-v8a-release.apk out/SoundAura-Phone-arm64.apk
          cp app/build/outputs/apk/phone/release/app-phone-armeabi-v7a-release.apk out/SoundAura-Phone-arm32.apk
          cp app/build/outputs/apk/tv/release/app-tv-universal-release.apk out/SoundAura-TV-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoundAura-Phone-and-TV
          path: android-app/out/*.apk

      # Свежая сборка всегда лежит в релизе «SoundAura (последняя версия)».
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest out/*.apk \
            --title "SoundAura (последняя версия)" \
            --notes "Сборка из ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Телефон — SoundAura-Phone-arm64.apk; Android TV — SoundAura-TV-universal.apk." \
            --target "$GITHUB_SHA"
